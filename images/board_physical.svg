<!-- 图例 -->
<g font-size="11">
<line x1="280" y1="690" x2="310" y2="690" stroke="#3b6fd8" stroke-width="3"/><text x="316" y="694">CPU 直连的高速线</text>
<line x1="460" y1="690" x2="490" y2="690" stroke="#2e8b57" stroke-width="2"/><text x="496" y="694">经 PCH 的线</text>
<line x1="620" y1="690" x2="650" y2="690" stroke="#777" stroke-width="5"/><text x="656" y="694">DMI 主干道</text>
<line x1="280" y1="716" x2="310" y2="716" stroke="#e08a00" stroke-width="2" stroke-dasharray="6 4"/><text x="316" y="720">I²C 慢速管理线</text>
<line x1="460" y1="716" x2="490" y2="716" stroke="#8e44ad" stroke-width="2"/><text x="496" y="720">SPI</text>
<line x1="620" y1="716" x2="650" y2="716" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/><text x="656" y="720">插进去 / 接上</text>
<text x="280" y="744" fill="#7a5200" font-size="10">棕色小字＝紧挨着的那个缩写或元件是什么</text>
</g>

<!-- ================= 图下说明 ================= -->
<line x1="20" y1="765" x2="880" y2="765" stroke="#ccc"/>
<g font-size="12" fill="#222">
<text x="20" y="792" font-weight="bold" font-size="14" fill="#2e7d32">一、三种硬盘：走哪条路、说什么话、插在哪</text>
<text x="20" y="814">硬盘和电脑交流要定两件事：① 走哪条“路”（物理线路）；② 说什么“话”（“读第几块”这类命令的格式）。</text>
<text x="20" y="836">• SATA 机械硬盘：路＝SATA，话＝AHCI，用 SATA 线接主板的 SATA 口。受磁盘转速限制，每秒约 200MB。</text>
<text x="20" y="856">• SATA 固态硬盘：路＝SATA，话＝AHCI，接 SATA 口，也有做成 M.2 形状的。受 SATA 限制，最快每秒约 550MB。</text>
<text x="20" y="876">• NVMe 固态硬盘：路＝PCIe，话＝NVMe，常见 M.2 外形；插槽可接 CPU 或芯片组。本图画直连 CPU 示例。</text>
<text x="20" y="896">• AHCI：给机械硬盘设计的“话”。只有 1 条排队通道，最多排 32 个命令，像超市只开 1 个收银台。</text>
<text x="20" y="916">• NVMe：给固态硬盘设计的“话”。可以开上万条排队通道，CPU 每个核心都能有自己专用的一条。</text>
<text x="20" y="936">• 所以“SATA 对 NVMe”并不严格：SATA 对应的是 PCIe（都是路），AHCI 对应的是 NVMe（都是话）。</text>
<text x="20" y="956">• M.2 只是插槽形状：外形一样的 M.2 硬盘，有的走 SATA，有的走 PCIe + NVMe，买时看标注。</text>

<text x="20" y="992" font-weight="bold" font-size="14" fill="#3b6fd8">二、哪些线有时钟、为什么</text>
<text x="20" y="1014">时钟线的作用：给接收方打拍子，告诉它“现在该读了”，还让双方数着拍子知道一次读写进行到第几步。</text>
<text x="20" y="1036">• DDR：有时钟线（CK），由 CPU 的内存控制器发给内存条，内存按这个拍子接收命令和地址。</text>
<text x="20" y="1056">   数据线旁边另有选通线（DQS）跟着数据一起走，接收方按它读数据。线很短、要求极快响应，所以保留了时钟。</text>
<text x="20" y="1076">• I²C / SMBus：有时钟线（SCL），由 PCH 发出。SCL 低时数据线 SDA 可以变，SCL 高时 SDA 必须稳住、对方来读。</text>
<text x="20" y="1096">   每个 SCL 周期传 1 位，每秒 10 万～40 万位，很慢，但只要两根线，适合读温度、读 SPD 这种小数据。</text>
<text x="20" y="1116">• PCIe、DMI、SATA、USB：没有单独的时钟线。接收方从数据的 0→1、1→0 跳变里自己推算节拍（时钟数据恢复）。</text>
<text x="20" y="1136">   为保证数据里经常有跳变，发送前要先编码或打乱，避免出现一长串全 0 或全 1。</text>
<text x="20" y="1156">• 为什么高速线不带时钟线：频率极高时，时钟线和数据线只要长短差一点，到达时间就对不上，干脆让数据自己带节拍。</text>
<text x="20" y="1176">• 没有时钟线 ≠ 没有时钟：两端芯片内部各有时钟，主板给它们一个 100MHz 参考时钟，双方频率偏差须在百万分之三百内。</text>

<text x="20" y="1212" font-weight="bold" font-size="14" fill="#b36b00">三、开机时这些线怎么配合</text>
<text x="20" y="1234">① 按下电源 → CPU 经 DMI → PCH → SPI 线，从 BIOS 芯片读出开机程序开始运行。</text>
<text x="20" y="1254">② 开机程序让 PCH 在 I²C 线上发地址 0x50，第一根内存条的 SPD 回应；再发 0x51、0x52…… 依次读其他插槽。</text>
<text x="20" y="1274">   例：读到 SPD 第 2 号字节是 0x12，含义是“这是 DDR5 内存”。</text>
<text x="20" y="1294">③ 按读到的容量、速度、延迟，设置 CPU 里的内存控制器。</text>
<text x="20" y="1314">④ 之后读写内存全走 DDR 线（每秒几十 GB），SPD 那两根细线不再参与。</text>

<text x="20" y="1350" font-weight="bold" font-size="14" fill="#555">四、其他要点</text>
<text x="20" y="1372">• 此图画直连示例；显卡与 SSD 也可能经 PCIe 交换芯片连接。支持时可做设备间 DMA，路径取决于拓扑与平台配置。</text>
<text x="20" y="1392">• PCIe 根端口连接相邻设备或交换芯片；交换芯片下可接多个端点，共用上行链路。根复合体管理这些端口。</text>
<text x="20" y="1412">• PCIe 每条通道收、发各一对线，可以同时双向传（全双工）。x16 是 16 条这样的通道并排，每条内部仍是串行。</text>
<text x="20" y="1432">• 本图的 USB 与 SATA 经 PCH，共用 PCH 到 CPU 的上行链路；网卡的连接位置因主板而异。</text>
<text x="20" y="1452">• I²C / SMBus 是真正的“共享总线”：所有小芯片挂在同两根线上，靠 7 位地址区分，地址对上的才回应。</text>
<text x="20" y="1472">• 内存条上有两条线接两种芯片：DDR 线接内存颗粒（传数据），I²C 线接 SPD（读身份证），互不相干。</text>
<text x="20" y="1492">• 金手指：电路板边缘一排金色触点，插进插槽后就和主板上的铜线接通。内存条、显卡、M.2 硬盘都有。</text>
<text x="20" y="1512">• 内存控制器：CPU 里专门负责读写内存的电路，以前在北桥芯片里，后来搬进了 CPU。</text>
</g>
</svg>

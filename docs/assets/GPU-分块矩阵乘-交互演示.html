<style>
#ie-demo{
  --bg:#ffffff; --fg:#1a1d21; --muted:#6b7280; --line:#bcc3cc;
  --frame:#aab1bb; --fill:#f3f4f6; --accent:#2563eb; --accent-soft:#dbeafe;
  --hot:#1d5e78; --hot-soft:#e8eff4; --panel:#f8f9fb; --border:#e3e6ea;
  --warn:#fff7ed; --warnbd:#fdba74; --ok:#15803d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--fg); background:var(--bg); outline:none;
  max-width:2400px; margin:0 auto; padding:20px 18px 26px;
  border:1px solid var(--border); border-radius:14px; line-height:1.72; font-size:15px; box-sizing:border-box;
}
#ie-demo *,#ie-demo *::before,#ie-demo *::after{box-sizing:border-box;}
#ie-demo h2{margin:0 0 4px; font-size:21px;}
#ie-demo .sub{margin:0 0 14px; color:var(--muted); font-size:14px;}
#ie-demo code{font-family:var(--mono); background:var(--fill); padding:1px 5px; border-radius:4px; font-size:13.5px;}
#ie-demo .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px;}
#ie-demo .tab{border:1px solid var(--border); background:var(--panel); color:var(--fg); padding:7px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:14px;}
#ie-demo .tab:hover{border-color:var(--accent);}
#ie-demo .tab.cur{background:var(--accent); border-color:var(--accent); color:#fff;}
#ie-demo .intro{font-size:14.5px; color:var(--muted); margin:0 0 10px;}
#ie-demo svg{width:100%; height:auto; display:block; background:var(--bg); border:1px solid var(--border); border-radius:10px;}
#ie-demo svg text{fill:var(--fg); font-size:12.5px;}
#ie-demo svg .t{font-weight:600; font-size:13.5px;}
#ie-demo svg .s{fill:var(--muted); font-size:11.5px;}
#ie-demo svg .v{font-family:var(--mono); font-size:12px; fill:var(--accent);}
#ie-demo svg .box{fill:var(--panel); stroke:var(--frame); stroke-width:1.2;}
#ie-demo svg .cell{fill:var(--bg); stroke:var(--frame); stroke-width:1;}
#ie-demo svg .wire{fill:none; stroke:var(--line); stroke-width:1.6;}
#ie-demo svg .zone{fill:none; stroke:var(--frame); stroke-width:1.4; stroke-dasharray:7 5;}
#ie-demo svg .cell.on,#ie-demo svg .box.on{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.2;}
#ie-demo svg .cell.hot{fill:var(--hot-soft); stroke:var(--hot); stroke-width:2.2;}
#ie-demo svg .wire.on{stroke:var(--hot); stroke-width:3; stroke-dasharray:8 5; animation:ie-flow .7s linear infinite;}
@keyframes ie-flow{to{stroke-dashoffset:-13;}}
#ie-demo .ctl{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 8px;}
#ie-demo .btn{border:1px solid var(--border); background:var(--panel); color:var(--fg); padding:6px 14px; border-radius:8px; cursor:pointer; font:inherit; font-size:14px;}
#ie-demo .btn:hover{border-color:var(--accent); color:var(--accent);}
#ie-demo .cnt{font-family:var(--mono); color:var(--muted); font-size:13.5px;}
#ie-demo .bar{flex:1; min-width:120px; height:6px; background:var(--fill); border-radius:3px; overflow:hidden;}
#ie-demo .bar i{display:block; height:100%; background:var(--accent); width:0;}
#ie-demo .step{border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:9px; background:var(--panel); padding:12px 16px; min-height:120px;}
#ie-demo .steprow{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:12px; align-items:stretch;}
@media (max-width:820px){#ie-demo .steprow{grid-template-columns:1fr;}}
#ie-demo .tl{border:1px solid var(--border); border-radius:9px; background:var(--panel); padding:10px 14px; font-size:14px;}
#ie-demo .tl.on{border-color:var(--accent); background:var(--accent-soft);}
#ie-demo .tl .tlh{font-weight:600; margin-bottom:4px;}
#ie-demo .why{border:1px solid var(--border); border-radius:10px; background:var(--panel); padding:12px 16px; margin:14px 0 0;}
#ie-demo .why h3{margin:0 0 6px; font-size:16px;}
#ie-demo .why p{margin:0 0 8px;}
#ie-demo .step h3{margin:0 0 6px; font-size:16.5px;}
#ie-demo .step p{margin:0 0 6px;}
#ie-demo .step .who{display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; margin-right:6px; vertical-align:2px; border:1px solid var(--border);}
#ie-demo .who.hw{color:#b45309; border-color:#f59e0b;}
#ie-demo .who.sw{color:var(--ok); border-color:var(--ok);}
#ie-demo .who.dev{color:var(--accent); border-color:var(--accent);}
#ie-demo .hint{color:var(--muted); font-size:13px; margin-top:8px;}
#ie-demo details{border:1px solid var(--border); border-radius:10px; background:var(--panel); margin:14px 0 0; padding:0 15px;}
#ie-demo details[open]{padding-bottom:12px;}
#ie-demo summary{cursor:pointer; padding:11px 0; font-weight:600; list-style:none;}
#ie-demo summary::-webkit-details-marker{display:none;}
#ie-demo summary::before{content:"▸ "; color:var(--accent);}
#ie-demo details[open] summary::before{content:"▾ ";}
#ie-demo table{width:100%; border-collapse:collapse; font-size:13.5px; margin:6px 0 10px;}
#ie-demo th,#ie-demo td{border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top;}
#ie-demo th{background:var(--fill);}
#ie-demo .chain{display:flex;flex-wrap:wrap;gap:6px 30px;margin:4px 0 10px;}
#ie-demo .chip{position:relative;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:4px 12px;font-size:14px;}
#ie-demo .chip:empty{display:none;}
#ie-demo .chip+.chip::before{content:"→";position:absolute;left:-22px;color:var(--muted);}
#ie-demo .chip.on{background:var(--hot-soft);border-color:var(--hot);font-weight:600;}
#ie-demo .tl table{margin:0;font-size:13.5px;}
#ie-demo .tl td:first-child{color:var(--muted);white-space:nowrap;width:5.5em;}
#ie-demo .who.fw{color:#7c3aed;border-color:#a78bfa;}
#ie-demo svg .pt{font-family:var(--mono);font-size:12px;}
#ie-demo .mainrow{display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:16px; align-items:start;}
#ie-demo .side{position:sticky; top:8px;}
#ie-demo .side .ctl{margin-top:0;}
#ie-demo .side .steprow{grid-template-columns:1fr;}
@media (max-width:1300px){#ie-demo .mainrow{grid-template-columns:1fr;} #ie-demo .side{position:static;}}
#ie-demo .side .step{font-size:14px; line-height:1.65;}
#ie-demo .side .step h3{font-size:15.5px;}
#ie-demo .side .tl table{font-size:13.5px;}
#ie-demo details{font-size:16px;}
#ie-demo details table{font-size:15.5px;}
#ie-demo .notes{margin-top:14px; display:flex; flex-direction:column; gap:12px; font-size:15.5px;}
#ie-demo .note-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:1000px){#ie-demo .note-row{grid-template-columns:1fr;}}
#ie-demo .note{border:1px solid var(--border); border-radius:10px; background:var(--panel); padding:10px 16px;}
#ie-demo .note.on{border-color:var(--accent); background:var(--accent-soft);}
#ie-demo .note h4{margin:0 0 6px; font-size:16.5px;}
#ie-demo .note ul{margin:0; padding-left:1.2em;} #ie-demo .note li{margin:3px 0;}
#ie-demo .note p{margin:6px 0;}
#ie-demo .note .cap{color:var(--muted); margin:10px 0 4px;}
#ie-demo .strip{display:flex; border:1px solid var(--frame); border-radius:6px; overflow:hidden; background:var(--bg);}
#ie-demo .strip span{border-right:1px solid var(--frame); padding:6px 10px; text-align:center; white-space:nowrap; font-family:var(--mono); font-size:14px;}
#ie-demo .strip span[style]{font-family:inherit; font-size:15px;}
#ie-demo .strip span:last-child{border-right:0;}
#ie-demo .strip .grow{flex:1; color:var(--muted); font-family:inherit;}
#ie-demo .strip small{display:block; color:var(--muted); font-size:13px;}
#ie-demo .zoom{display:grid; grid-template-columns:220px 1fr; gap:12px;}
#ie-demo .zoom>div{border:1px solid var(--frame); border-radius:6px; background:var(--bg); padding:10px 14px;}
#ie-demo .zoom .mut{color:var(--muted); font-size:14px;}
#ie-demo .files{width:100%; margin:8px 0; font-size:15px;}
#ie-demo .files td{border:0; padding:3px 14px 3px 0;}
#ie-demo .strip span.pbr{background:#fff3e0; font-weight:600;}
#ie-demo .strip .grp{display:flex; flex-direction:column; border-right:1px solid var(--frame);}
#ie-demo .strip .grp:last-child{border-right:0;}
#ie-demo .strip .grp .in{display:flex; flex:1;}
#ie-demo .strip .grp .in span:last-child{border-right:0;}
#ie-demo .strip .glab{border-top:2px solid var(--accent); background:var(--accent-soft); text-align:center; font-weight:600; padding:3px; font-size:14.5px;}
#ie-demo #note-why table td{border:1px solid var(--border); padding:5px 10px; background:var(--bg);}
#ie-demo #note-why table tr:first-child td{background:var(--fill);}

<h2>分块矩阵乘：先把小块搬进共享内存，再反复用</h2>
<p class="sub">左边是 HBM 里的 A、B、C（4×4），中间是这个线程块在 SM 上的共享内存，右边是块里的 4 个线程，每个线程算 C 的一个元素，累加值放在自己的寄存器 acc 里。右上角数着“这个线程块一共从 HBM 读了几个数”。　<b>← / →</b> 前进后退；这个演示可以<b>单独在新页面打开</b>（两栏页左上「⧉ 单独打开这张」）。</p>

var SCN=[{"name": "① 不分块：每个线程自己去 HBM 拿", "intro": "先看最直接的写法。只追踪 C 左上角 2×2 这一个线程块。", "show": ["g"], "steps": [{"t": "线程 (0,0)：k = 0", "on": ["T00", "A00", "B00", "cnt"], "set": {"T00-v": "acc = 1", "T00-w": "k=0：1×1", "T00-x": "HBM 读 2 次", "cnt-v": "2 次（只算线程 (0,0)）", "st-0": "不分块", "st-1": "线程 (0,0) 第 1 轮", "st-2": "2", "T01-v": "acc = 0", "T10-v": "acc = 0", "T11-v": "acc = 0", "T01-w": "", "T10-w": "", "T11-w": "", "T01-x": "", "T10-x": "", "T11-x": "", "T00-y": "", "T01-y": "", "T10-y": "", "T11-y": ""}, "d": "<p>最直接的写法：每个线程自己算一整个点积，要哪个数就去 HBM 读哪个数。</p><p><span class=\"who hw\">硬件</span>线程 (0,0) 从 HBM 读 A[0][0] = 1 和 B[0][0] = 1，乘起来加到 acc：acc = 0 + 1×1 = 1。</p>"}, {"t": "线程 (0,0)：k = 1", "on": ["T00", "A01", "B10", "cnt"], "set": {"T00-v": "acc = 1", "T00-w": "k=1：2×0", "T00-x": "HBM 读 4 次", "cnt-v": "4 次（只算线程 (0,0)）", "st-0": "不分块", "st-1": "线程 (0,0) 第 2 轮", "st-2": "4"}, "d": "<p><span class=\"who hw\">硬件</span>线程 (0,0) 从 HBM 读 A[0][1] = 2 和 B[1][0] = 0，乘起来加到 acc：acc = 1 + 2×0 = 1。</p>"}, {"t": "线程 (0,0)：k = 2", "on": ["T00", "A02", "B20", "cnt"], "set": {"T00-v": "acc = 4", "T00-w": "k=2：3×1", "T00-x": "HBM 读 6 次", "cnt-v": "6 次（只算线程 (0,0)）", "st-0": "不分块", "st-1": "线程 (0,0) 第 3 轮", "st-2": "6"}, "d": "<p><span class=\"who hw\">硬件</span>线程 (0,0) 从 HBM 读 A[0][2] = 3 和 B[2][0] = 1，乘起来加到 acc：acc = 1 + 3×1 = 4。</p>"}, {"t": "线程 (0,0)：k = 3", "on": ["T00", "A03", "B30", "cnt"], "set": {"T00-v": "acc = 4", "T00-w": "k=3：4×0", "T00-x": "HBM 读 8 次", "cnt-v": "8 次（只算线程 (0,0)）", "st-0": "不分块", "st-1": "线程 (0,0) 第 4 轮", "st-2": "8"}, "d": "<p><span class=\"who hw\">硬件</span>线程 (0,0) 从 HBM 读 A[0][3] = 4 和 B[3][0] = 0，乘起来加到 acc：acc = 4 + 4×0 = 4。</p><p>C[0][0] = 4 算完。线程 (0,0) 读了 A 的第 0 行 4 个数、B 的第 0 列 4 个数，共 8 次 HBM 读取。</p>"}, {"t": "4 个线程都这样做：32 次读，一半是重复的", "on": ["T00", "T01", "T10", "T11", "cnt", "A00", "A01", "A02", "A03", "B00", "B10", "B20", "B30", "C00", "C01", "C10", "C11"], "set": {"T01-v": "acc = 5", "T10-v": "acc = 12", "T11-v": "acc = 13", "T00-w": "", "T00-x": "HBM 读 8 次", "T01-x": "HBM 读 8 次", "T10-x": "HBM 读 8 次", "T11-x": "HBM 读 8 次", "C00-t": "4", "C01-t": "5", "C10-t": "12", "C11-t": "13", "cnt-v": "32 次", "cnt-w": "其中不同的数只有 16 个", "sum-x": "不分块：每个线程读 2×4 = 8 次，块共 32 次。", "sum-y": "A[0][·] 被线程 (0,0)、(0,1) 各读一遍，", "sum-z": "B[·][0] 被 (0,0)、(1,0) 各读一遍。", "st-1": "4 个线程都算完", "st-2": "32"}, "d": "<p><span class=\"who hw\">硬件</span>另外 3 个线程同样各读 8 次：C[0][1] = 5，C[1][0] = 12，C[1][1] = 13。这个块一共读了 32 次 HBM，但涉及的不同数字只有 A 的前两行、B 的前两列共 16 个——A 的第 0 行被线程 (0,0) 和 (0,1) 各从 HBM 读了一遍，B 的第 0 列被 (0,0) 和 (1,0) 各读了一遍。</p><p>推广到 N×N：输出的每个元素要读 2N 个数，A 的每个数会被读 N 次（每个输出列一次）。N = 4096 时，同一个数从 HBM 读 4096 遍。</p>"}]}, {"name": "② 分块：小块进共享内存，反复用", "intro": "同一个线程块、同样 4 个线程，换一种做法：k 方向切成两段，每段先合力搬一个 2×2 小块进共享内存。", "show": ["g"], "steps": [{"t": "阶段 1：每个线程搬 A、B 各一个数", "on": ["S00", "S01", "S10", "S11", "U00", "U01", "U10", "U11", "A00", "A01", "A10", "A11", "B00", "B01", "B10", "B11", "T00", "T01", "T10", "T11", "cnt"], "set": {"T00-v": "acc = 0", "T01-v": "acc = 0", "T10-v": "acc = 0", "T11-v": "acc = 0", "T00-w": "", "T01-w": "", "T10-w": "", "T11-w": "", "T00-x": "搬了 A、B 各 1 个", "T01-x": "搬了 A、B 各 1 个", "T10-x": "搬了 A、B 各 1 个", "T11-x": "搬了 A、B 各 1 个", "T00-y": "", "T01-y": "", "T10-y": "", "T11-y": "", "S00-t": "A[0][0] = 1", "S01-t": "A[0][1] = 2", "S10-t": "A[1][0] = 5", "S11-t": "A[1][1] = 6", "U00-t": "B[0][0] = 1", "U01-t": "B[0][1] = 0", "U10-t": "B[1][0] = 0", "U11-t": "B[1][1] = 1", "cnt-v": "8 次", "cnt-w": "", "st-0": "分块 · 阶段 1", "st-1": "搬 A[0..1][0..1]、B[0..1][0..1]", "st-2": "8"}, "d": "<p><span class=\"who hw\">硬件</span>线程 (r,c) 从 HBM 读 A[r][c] 和 B[r][c]，写进共享内存的 As[r][c]、Bs[r][c]。4 个线程同时动手，一共读 8 次 HBM。</p><p>相邻线程读相邻地址，这些读还能合并（见合并访存那一节）。</p>"}, {"t": "同步：等 4 个线程都搬完", "on": ["bar", "T00", "T01", "T10", "T11"], "set": {"bar-v": "4 / 4 个线程已到达", "bar-w": "全部到齐，放行", "st-1": "等所有线程到齐"}, "d": "<p><span class=\"who hw\">硬件</span>kernel 里写一句 <code>__syncthreads()</code>：先到的线程在这里停下，等块里所有线程都到。否则线程 (0,0) 可能在线程 (1,1) 还没把 Bs[1][1] 写进去时就去读它，读到旧值。</p><p>同步只能在一个线程块内部做——这也是“块”这一层存在的理由：同一块的线程在同一个 SM 上，共用一块共享内存，可以互相等。</p>"}, {"t": "阶段 1：只读共享内存，算部分和", "on": ["T00", "T01", "T10", "T11", "S00", "S01", "S10", "S11", "U00", "U01", "U10", "U11"], "set": {"bar-v": "—", "bar-w": "", "T00-v": "acc = 1", "T01-v": "acc = 2", "T10-v": "acc = 5", "T11-v": "acc = 6", "T00-w": "1×1 + 2×0", "T01-w": "1×0 + 2×1", "T10-w": "5×1 + 6×0", "T11-w": "5×0 + 6×1", "T00-y": "读共享内存 4 次", "T01-y": "读共享内存 4 次", "T10-y": "读共享内存 4 次", "T11-y": "读共享内存 4 次", "st-1": "用 As、Bs 算 k = 0, 1", "st-2": "8（没变）"}, "d": "<p><span class=\"who hw\">硬件</span>每个线程从共享内存读 As 的一行两个数、Bs 的一列两个数，做两次乘加。As[0][·] 被线程 (0,0)、(0,1) 都用了——但这次是从共享内存读的，HBM 读次数没变。</p><p>部分和：C[0][0] 的 acc = 1，C[0][1] = 2，C[1][0] = 5，C[1][1] = 6。</p>"}, {"t": "阶段 2：再搬下一对小块", "on": ["S00", "S01", "S10", "S11", "U00", "U01", "U10", "U11", "A02", "A03", "A12", "A13", "B20", "B21", "B30", "B31", "T00", "T01", "T10", "T11", "cnt"], "set": {"S00-t": "A[0][2] = 3", "S01-t": "A[0][3] = 4", "S10-t": "A[1][2] = 7", "S11-t": "A[1][3] = 8", "U00-t": "B[2][0] = 1", "U01-t": "B[2][1] = 1", "U10-t": "B[3][0] = 0", "U11-t": "B[3][1] = 0", "cnt-v": "16 次", "st-0": "分块 · 阶段 2", "st-1": "搬 A[0..1][2..3]、B[2..3][0..1]", "st-2": "16", "T00-x": "又搬了 A、B 各 1 个", "T01-x": "又搬了 A、B 各 1 个", "T10-x": "又搬了 A、B 各 1 个", "T11-x": "又搬了 A、B 各 1 个", "T00-w": "", "T01-w": "", "T10-w": "", "T11-w": "", "T00-y": "", "T01-y": "", "T10-y": "", "T11-y": ""}, "d": "<p><span class=\"who hw\">硬件</span>再同步一次（确认大家都用完了旧的小块），然后 4 个线程把 A 的右半 A[0..1][2..3]、B 的下半 B[2..3][0..1] 搬进来，覆盖原来的 As、Bs。又是 8 次 HBM 读取。</p>"}, {"t": "阶段 2：算完，写回 C", "on": ["T00", "T01", "T10", "T11", "C00", "C01", "C10", "C11", "cnt", "sum"], "set": {"T00-v": "acc = 4", "T01-v": "acc = 5", "T10-v": "acc = 12", "T11-v": "acc = 13", "T00-w": "1 + 3×1 + 4×0", "T01-w": "2 + 3×1 + 4×0", "T10-w": "5 + 7×1 + 8×0", "T11-w": "6 + 7×1 + 8×0", "C00-t": "4", "C01-t": "5", "C10-t": "12", "C11-t": "13", "cnt-w": "不分块时是 32 次", "T00-x": "", "T01-x": "", "T10-x": "", "T11-x": "", "sum-x": "分块：每个数只从 HBM 读一次，块共 16 次。", "sum-y": "N×N、块边长 T：每个数从 HBM 读 N/T 次，", "sum-z": "比不分块少 T 倍。N=4096、T=128：4096 次 → 32 次。", "st-1": "结果写回 HBM", "st-2": "16（不分块 32）"}, "d": "<p><span class=\"who hw\">硬件</span>再用新的小块各做两次乘加：C[0][0] = 1 + 3×1 + 4×0 = 4，C[0][1] = 5，C[1][0] = 12，C[1][1] = 13，和不分块完全一样。最后把 4 个结果写回 HBM。</p><p>HBM 读取从 32 次降到 16 次，正好少了 T = 2 倍：每个数只从 HBM 搬进来一次，之后在共享内存里被块里需要它的线程反复用。一般地，N×N 矩阵、块边长 T，每个数从 HBM 读 $N/T$ 次（不分块是 $N$ 次）。真实的 kernel 块边长取 64、128 甚至更大，HBM 流量少几十上百倍；块里的乘加再交给 Tensor Core 一次做一小块矩阵。</p>"}]}];
var TOGGLE=["g"];
var cur=0,idx=0,timer=null,IDS=[],HID=[];
root.querySelectorAll('svg .cell,svg .box,svg .wire').forEach(function(e){if(e.id)IDS.push(e.id);});
function setText(m){for(var k in m){var e=$(k);if(e)e.textContent=m[k];}}
function render(){
 var s=SCN[cur],st=s.steps[idx];
 IDS.forEach(function(id){$(id).classList.remove('on');});
 TOGGLE.forEach(function(id){$(id).style.display=s.show.indexOf(id)>=0?'':'none';});
 setText(BASE);
 HID.forEach(function(id){var e=$(id);if(e)e.style.display='';});HID=[];
 for(var i=0;i<=idx;i++){if(s.steps[i].set)setText(s.steps[i].set);}
 (st.hide||[]).forEach(function(id){[id,id+'-t',id+'-v',id+'-w'].forEach(function(j){var e=$(j);if(e){e.style.display='none';HID.push(j);}});});
 st.on.forEach(function(id){var e=$(id);if(e)e.classList.add('on');});
 $('ieTitle').textContent=(idx+1)+'. '+st.t;
 $('ieBody').innerHTML=st.d;
 if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([$('ieBody')]).catch(function(){});}
 $('ieCnt').textContent=(idx+1)+' / '+s.steps.length;
 $('ieScn').textContent=SCN.length>1?('第 '+(cur+1)+' 幕，共 '+SCN.length+' 幕'):'';
 $('ieBar').style.width=((idx+1)/s.steps.length*100)+'%';
 $('ieIntro').textContent=s.intro;
 root.querySelectorAll('.tab').forEach(function(b,i){b.classList.toggle('cur',i===cur);});
}
function go(n){var m=SCN[cur].steps.length;idx=Math.max(0,Math.min(m-1,n));render();}
function stop(){if(timer){clearInterval(timer);timer=null;}$('iePlay').textContent='▶ 自动播放';}
SCN.forEach(function(s,i){var b=document.createElement('button');b.className='tab';b.textContent=s.name;
 b.onclick=function(){stop();cur=i;idx=0;render();};$('ieTabs').appendChild(b);});
$('iePrev').onclick=function(){stop();go(idx-1);};
$('ieNext').onclick=function(){stop();go(idx+1);};
$('iePlay').onclick=function(){if(timer){stop();return;}$('iePlay').textContent='⏸ 暂停';
 timer=setInterval(function(){if(idx>=SCN[cur].steps.length-1){stop();return;}go(idx+1);},4500);};
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='ArrowRight'){stop();go(idx+1);e.preventDefault();}
 else if(e.key==='ArrowLeft'){stop();go(idx-1);e.preventDefault();}});
function fromHash(){var m=/^#s(\d+)$/.exec(location.hash);if(m){var n=+m[1]-1;if(n>=0&&n<SCN.length){stop();cur=n;idx=0;}}}
fromHash();window.addEventListener('hashchange',function(){fromHash();render();});
render();
})();

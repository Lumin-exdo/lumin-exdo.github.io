<div class="scroll" data-default-fit="width"><svg viewBox="0 0 1000 690" role="img" aria-label="ReLU kernel 从 CPU 发出命令、GigaThread 分块到 132 个 SM，SM 分区里 warp 的执行、访存、分支掩码与总耗时"><g id="draw"></g></svg></div><footer id="note"></footer>

 {b:'① 启动',h:690,steps:[
  {t:'PyTorch 选中一个 kernel',n:'x 在 GPU 上，PyTorch 就挑出一个已经编译好的 GPU 程序来算 ReLU。在 GPU 上运行的函数叫 <b>kernel</b>。它的写法是“<b>一个线程</b>做什么”：线程算出自己的编号 i，读 x[i]，取 max(x[i], 0)，写 y[i]。要处理 16 777 216 个数，就开 16 777 216 个线程。'},
  {t:'CPU 写一条命令，torch.relu 立刻返回',n:'CUDA 驱动（在 CPU 上运行）把“跑哪个 kernel、开多少线程、x 和 y 的地址”写成一条命令，放进命令队列，通知 GPU。Python 不等 GPU 算完就继续往下执行（<b>异步</b>）。这一套约 2–5 µs。'},
  {t:'线程按 256 个一组打包成线程块',n:'线程每 256 个编成一个<b>线程块</b>（block），块 b 负责 x[256b] 到 x[256b+255]。16 777 216 ÷ 256 = 65 536 个块，全部块合起来叫一个 <b>grid</b>。一个块从头到尾只在一个 SM 上运行。'},
  {t:'GigaThread 引擎把块分给 132 个 SM',n:'一个 SM 最多同时住 2048 个线程，也就是 8 个这样的块。132 个 SM 先各拿 8 个：SM 0 拿到块 0、132、264……，共 1056 个块上了 SM，其余 64 480 个排队。某个块跑完，SM 空出位置，队首的块补上。'}]},

  {t:'t = 0：调度器给 W0 发“算下标”',n:'同一条指令 <code>i = 块号×256 + 线程号</code> 同时发给 32 条通道。32 个线程各用自己寄存器里的线程号，算出 0、1、2……31。一条指令、32 个线程、各算各的数据，这种执行方式叫 <b>SIMT</b>（单指令多线程）。'},
  {t:'t ≈ 1 ns：W0 发“读 x[i]”，32 个地址合并成一次请求',n:'32 个线程要读的地址是 0x7000_0000、…_0004、…、…_007C，正好连续 128 字节。读写单元把它们<b>合并</b>成一次 128 字节的请求（第 6.5 节细讲）。L1 没有、L2 也没有，请求发往 HBM。W0 进入等待。'},
  {t:'t ≈ 1–8 ns：每周期换一个 warp，16 个 warp 都在等',n:'下一个周期，调度器给 W1 发同样的指令，再下一个给 W2……约 8 ns 后，W0–W15 都发出了读请求，全在等。换 warp 不用保存任何东西，它们的寄存器一直在寄存器堆里。'},
  {t:'t ≈ 350 ns：W0 的数据回来了',n:'HBM 送回 128 字节，32 个数分别落进 W0 的 32 个线程的 r1。W0 重新“就绪”。其余 warp 的数据随后陆续到达。'},
  {t:'t ≈ 351 ns：一条 max 指令，32 个结果',n:'调度器给 W0 发 <code>r2 = max(r1, 0)</code>，32 条通道一个周期算完：−3、2、−1、5 → 0、2、0、5。'},
  {t:'t ≈ 352 ns：写回 y，同样合并成一次',n:'32 个线程把 r2 写到 y[0..31]，地址 0x7400_0000 起连续 128 字节，合并成一次写。W0 的活干完了。'}]},
 {b:'③ 分支发散',h:690,steps:[
  {t:'如果 kernel 写成 if / else',n:'把 <code>y = max(x, 0)</code> 换成 <code>if (x &lt; 0) y = 0; else y = x;</code>。W0 的 32 个线程里，x 为负的（线程 0、2……）要走 if，其余走 else。可一个 warp 一次只能执行一条指令。'},
  {t:'第一遍：只让 x < 0 的线程执行 y = 0',n:'硬件用一个 32 位的<b>活动掩码</b>：x &lt; 0 的线程对应位是 1，其余是 0。执行 <code>y = 0</code> 时，掩码为 0 的通道空转。'},
  {t:'第二遍：掩码取反，只让其余线程执行 y = x',n:'再执行 else 分支，这回刚才空转的线程干活、刚才干活的空转。两条路的时间加在一起，这叫<b>分支发散</b>。它不会算错，只是更慢；能写成 max 这种不分支的形式更好。'}]},

  {t:'时间花在哪：38 µs 几乎全在搬数据',n:'读 x 64 MB、写 y 64 MB，共 128 MB；HBM 每秒最多搬 3.35 TB，所以至少要 38 µs。38 µs 里只做了 1678 万次比较，折合 0.44 TFLOP/s，而通道的峰值是 67 TFLOP/s：99% 以上的时间通道在等数据。反过来，张量很小时，2–5 µs 的启动开销反而成了大头。'},
  {t:'占用率：每线程用的寄存器多，能住的 warp 就少',n:'每个线程最多能用 255 个寄存器。例：一个块 64 个线程、每线程用 160 个寄存器，一个 SM 的 65 536 个寄存器最多放 6 个块 = 384 个线程，不到满额 2048 的五分之一。等内存时可换的 warp 少了。若每个线程多处理几个元素，线程少一些也能把通道喂饱。'}]}

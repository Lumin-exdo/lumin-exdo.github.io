<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">同一个地址数值，在独立编址和统一编址中指向哪里</title>
<desc id="desc">独立编址有 I/O 端口和内存两套地址空间，IN 0x60 访问端口而内存读 0x60 访问 RAM；统一编址只有一套地址空间，访存指令的目标范围决定访问 RAM 还是设备寄存器。</desc>
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bf661e"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2674a2"/></marker>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#223449}
.h{font-size:22px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:15px}.mono{font-family:Consolas,monospace;font-size:17px;font-weight:700}
.orange{fill:#fff0dc;stroke:#be782d;stroke-width:2}.blue{fill:#e9f3fb;stroke:#3e83af;stroke-width:2}
.ow{fill:none;stroke:#bf661e;stroke-width:3;marker-end:url(#o)}.bw{fill:none;stroke:#2674a2;stroke-width:3;marker-end:url(#b)}
</style>
</defs>
<rect width="1000" height="670" fill="#fbfaf7"/>
<text x="25" y="37" class="h">同一个数值 0x60，CPU 会访问哪里？</text>
<rect x="20" y="62" width="466" height="510" rx="14" fill="#fffdf9" stroke="#d2b48d" stroke-width="2"/>
<rect x="514" y="62" width="466" height="510" rx="14" fill="#f8fbfe" stroke="#a9c8d9" stroke-width="2"/>
<text x="40" y="97" class="t">① 独立编址：两张地址地图</text>
<text x="534" y="97" class="t">② 统一编址（MMIO）：一张地址地图</text>
<text x="42" y="128" class="s">例：x86 的专用 I/O 指令与普通访存指令</text>
<text x="536" y="128" class="s">例：设备寄存器占据一段物理地址</text>

<rect x="42" y="168" width="157" height="75" rx="10" fill="#e4ebf8" stroke="#5076ad" stroke-width="2"/>
<text x="120" y="200" text-anchor="middle" class="t">CPU</text>
<text x="120" y="224" text-anchor="middle" class="s">看指令类型分路</text>
<path d="M199 188H224V260H252" class="ow"/>
<path d="M199 224H220V431H252" class="bw"/>
<rect x="258" y="207" width="202" height="142" rx="10" class="orange"/>
<text x="359" y="237" text-anchor="middle" class="t">I/O 端口地址空间</text>
<line x1="271" y1="251" x2="447" y2="251" stroke="#d8ae75"/>
<text x="275" y="276" class="mono">0x60</text><text x="350" y="276" class="s">数据端口</text>
<text x="275" y="305" class="mono">0x64</text><text x="350" y="305" class="s">读状态／写控制</text>
<text x="274" y="333" class="s">由 I/O 读写信号选中</text>
<rect x="258" y="382" width="202" height="113" rx="10" class="blue"/>
<text x="359" y="414" text-anchor="middle" class="t">内存地址空间</text>
<line x1="271" y1="426" x2="447" y2="426" stroke="#8db7d0"/>
<text x="275" y="451" class="mono">0x60</text><text x="350" y="451" class="s">RAM 字节</text>
<text x="274" y="480" class="s">由内存读写信号选中</text>
<text x="42" y="276" class="mono" fill="#a95b20">IN AL, 0x60</text>
<text x="42" y="452" class="mono" fill="#256b94">MOV AL, [0x60]</text>
<text x="42" y="540" class="s">数值可以相同；指令／控制信号决定走哪张地图。</text>

<rect x="536" y="168" width="151" height="75" rx="10" fill="#e4ebf8" stroke="#5076ad" stroke-width="2"/>
<text x="611" y="200" text-anchor="middle" class="t">CPU</text>
<text x="611" y="224" text-anchor="middle" class="s">普通访存指令</text>
<rect x="737" y="175" width="220" height="309" rx="11" fill="#fff" stroke="#738b9d" stroke-width="2"/>
<text x="847" y="203" text-anchor="middle" class="t">唯一的物理地址地图</text>
<rect x="752" y="224" width="190" height="103" rx="7" class="blue"/>
<text x="847" y="253" text-anchor="middle" class="t">RAM 范围</text>
<text x="847" y="282" text-anchor="middle" class="mono">0x0000_0060</text>
<text x="847" y="309" text-anchor="middle" class="s">读出 RAM 字节</text>
<rect x="752" y="354" width="190" height="112" rx="7" class="orange"/>
<text x="847" y="382" text-anchor="middle" class="t">设备范围</text>
<text x="847" y="411" text-anchor="middle" class="mono">0xF000_1000</text>
<text x="847" y="440" text-anchor="middle" class="s">读／写设备寄存器</text>
<path d="M687 190H710V275H749" class="bw"/>
<path d="M687 220H704V410H749" class="ow"/>
<text x="536" y="280" class="mono" fill="#256b94">LOAD [0x60]</text>
<text x="536" y="415" class="mono" fill="#a95b20">LOAD / STORE</text>
<text x="536" y="440" class="mono" fill="#a95b20">[0xF000_1000]</text>
<text x="536" y="541" class="s">地址范围决定落到 RAM 还是设备；均走访存通路。</text>

<rect x="20" y="587" width="960" height="65" rx="11" fill="#eef3f1" stroke="#9eb9b0" stroke-width="1.5"/>
<text x="37" y="616" class="t">启动阶段</text>
<text x="154" y="616" class="s">MMIO 无须先启用 MMU：可按物理地址访问；启用虚拟内存后，由内核建立设备映射。</text>
<text x="154" y="640" class="s">图中的地址只是说明两种编址的示例，不表示某台机器的实际地址分配。</text>
</svg>

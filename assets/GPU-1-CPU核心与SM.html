<header><h1>CPU 核心和 GPU 的 SM：晶体管花在哪</h1><small>同一件事：对 x 做 ReLU（负数换成 0）。先盯住 x 开头的 −3、2、−1、5。每个部件里画的是它此刻装着的内容；部件大小为示意。</small><nav id="steps"></nav></header>
<div class="scroll" data-default-fit="width"><svg viewBox="0 0 1000 680" role="img" aria-label="CPU 核心的分支预测表、乱序执行窗口、缓存行、向量寄存器与向量单元；H100 SM 分区的 warp 槽、寄存器堆、32 条通道；等内存时两边的时间线"><g id="draw"></g></svg></div><footer id="note"></footer>

const steps=[
 {b:'① CPU 的一个核心',t:'CPU 核心：多数电路在帮一条线程少等',n:'x[0..15] 这一行已在 L1 缓存里，被装进向量寄存器 v1，向量单元一条 <code>max</code> 指令让 16 条通道同时算出结果（图里只写前 4 个）。核心的大部分电路是左上的<b>分支预测表</b>、右上的<b>乱序执行窗口</b>和中间的<b>缓存</b>：窗口里第 1 条指令在等内存，后面不依赖它的第 2、3 条已经先做完了。'},
 {b:'② GPU 的一个 SM',t:'SM 的一个分区：一条指令，32 条通道，16 个 warp 轮流',n:'H100 有 132 个 <b>SM</b>，每个 SM 有 4 个一样的分区。分区里的调度器每个周期从它的 warp 槽里挑一个“就绪”的 warp，发一条指令；这条指令同时送到 32 条通道，32 个线程各用自己寄存器里的数。一组同时接受同一条指令的 32 个线程叫 <b>warp</b>。寄存器堆里每个线程都有自己的一份寄存器（图里是 W0 的 32 个线程的 r0–r2）。'},
 {b:'③ 等内存时',t:'等内存的 350 ns：CPU 线程停着，SM 每周期换一个 warp',n:'时间轴中间断开：左段放大 0–10 ns，右段放大 350–360 ns。CPU 线程缓存没命中、窗口里又没有别的事可做，就停着等。SM 分区里 W0 发出读指令后，下一个周期调度器就给 W1 发，16 个 warp 在 8 ns 内都发出了读；约 350 ns 后数据陆续回来，再一个个算 max。换 warp 时不用保存寄存器，因为每个 warp 的寄存器一直放在寄存器堆里。'}

  for(let i=0;i<4;i++)K.arrow(`M${64+i*52} 500V562`,{c:'#b8473a',w:1.8});
  K.text(40,632,'核心里一共两三个这样的单元：真正做运算的电路只占一小块。',{c:'sm'});
 }else if(k===1){
  K.rect(14,14,972,652,{f:'#fbfaf7',s:'#3e8c55',sw:2.4,rx:12});K.text(28,42,'H100 的一个 SM（约 1.98 GHz）：放大分区 0，另外 3 个分区一模一样',{c:'b'});

  K.text(40,522,'通道 0–3 正在算 −3、2、−1、5 → 0、2、0、5',{c:'sm',size:14});K.text(40,544,'一份取指、调度电路带 32 条通道：省下的面积放通道和寄存器',{c:'sm',size:13});
  K.rect(682,434,290,120,{f:P.tc[0],s:P.tc[1],sw:1.8,rx:8});K.text(694,458,'Tensor Core',{c:'sm b'});
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)K.rect(700+c*20,470+r*18,18,16,{f:'#fff',s:'#d6b86a',sw:1,rx:2});K.text(790,486,'一条指令做一个',{c:'sm',size:13});K.text(790,506,'小矩阵乘加',{c:'sm',size:13});K.text(694,544,'ReLU 用不上，矩阵乘才用',{c:'sm',size:13});
  K.rect(28,566,944,86,{f:P.cache[0],s:P.cache[1],sw:1.8,rx:8});K.text(40,590,'4 个分区共用：共享内存 / L1 缓存 256 KB',{c:'sm b'});

  K.rect(ta(1),136,A1-ta(1),18,{f:P.wait[0],s:P.wait[1],dash:'5 4',sw:1});K.rect(B0,136,tb(352)-B0,18,{f:P.wait[0],s:P.wait[1],dash:'5 4',sw:1});K.text(ta(3),150,'停着等数据',{c:'sm',size:13});
  K.rect(tb(352),104,tb(353)-tb(352),26,{f:'#f7b6ab',s:'#b8473a',sw:1});K.text(tb(353)+6,122,'数据到，算',{c:'sm',size:13});

   K.text(A0-10,y+17,'W'+w,{a:'end',c:'sm mono',size:13});
   K.rect(ta(t0),y,ta(t0+0.5)-ta(t0),22,{f:'#f6c96b',s:'#b98a10',sw:1});

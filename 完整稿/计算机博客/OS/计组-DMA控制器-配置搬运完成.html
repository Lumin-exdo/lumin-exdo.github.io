<header><h1>设备的 3 字节怎样经 DMA 写入主存</h1><small>经典共享总线的教学模型；每一步都可单独查看。</small><nav id="steps"></nav></header>

 {b:'① CPU 预处理',t:'写入首地址、数量与方向',n:'CPU 只配置这批任务的参数并启动设备：首地址 0x4000、3 个字节、设备 → 主存。随后 CPU 可以继续执行其他指令。'},
 {b:'② 借到总线',t:'设备 DREQ → DMA 请求 → CPU 批准',n:'设备准备好数据后置 DREQ；DMAC 发 HRQ 申请系统总线，CPU 在当前总线周期结束后回 HLDA。授予期间由 DMAC 驱动总线，CPU 的访存可能暂时等待。'},
 {b:'③ 传一个字节',t:'A1 经 DMA 缓冲和系统总线写入主存',n:'数据从设备进入 DMAC 的数据缓冲寄存器，DMAC 再通过系统总线的地址线、数据线、控制线写主存 0x4000；CPU 不执行逐字节搬运指令。写完后下一地址变成 0x4001，剩余数量从 3 减到 2。后续字节重复此步。'},

 T(K,55,271,k===0?'端口写入 DMAC':k===1?'回 HLDA 授权':k===2?'执行别的指令':'接到完成 IRQ','b');
 if(k===0){T(K,55,310,'目的 RAM: 0x4000','sm');T(K,55,340,'长度: 3 字节','sm');T(K,55,370,'设备 0 → 主存','sm');T(K,55,400,'最后写 START','sm b');}

 R(K,542,197,185,55,k===0||k>=2?'#e7f2fb':'#fff','#79a1b8');T(K,555,220,'剩余字节计数器','sm b');T(K,555,243,k===3?'0（传完）':k===2?'3 → 2':'3','sm b');
 R(K,337,286,230,55,k===0||k===1?'#e7f2fb':'#fff','#79a1b8');T(K,350,309,'控制 / 状态逻辑','sm b');T(K,350,333,'设备 → 主存','sm');
 R(K,587,286,140,55,k===0?'#e7f2fb':'#fff','#79a1b8');T(K,600,309,'设备选择','sm b');T(K,600,333,'设备 0','sm');
 R(K,337,380,185,62,k>=2?'#ffead0':'#fff','#c99254');T(K,350,405,'数据缓冲寄存器','sm b');T(K,350,430,k===2?'0xA1':k===3?'0xC3':'—','mono b');

 R(K,850,190,210,300,'#edf5fa','#759ab1');T(K,867,221,'主存 RAM','lg');
 [['0x4000',k>=2?'A1':'—'],['0x4001',k===3?'B2':'—'],['0x4002',k===3?'C3':'—']].forEach((r,i)=>{
  let y=255+i*72;R(K,867,y,176,55,k===2&&i===0||k===3?'#ffead0':'#fff','#b6aaa0');T(K,882,y+23,r[0],'mono');T(K,985,y+36,r[1],'mono b');
 });

 if(k===0){T(K,145,146,'经总线配置 DMAC','sm b');}
 if(k===1){
  A(K,'M670 638H785V412H729',O);T(K,793,568,'DREQ','sm b');

 }

 T(K,40,712,k===0?'CPU 只负责设置这一批，不逐字节读写':k===1?'HRQ / HLDA 是借总线的握手；DREQ 来自设备':k===2?'外设 → DMA 数据缓冲 → 主存；地址 +1，剩余数 −1':'整块传完才发完成中断；数据已在 RAM 中','b');

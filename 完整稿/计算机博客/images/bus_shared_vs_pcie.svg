<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">共享总线与 PCIe 拓扑：谁共用物理线路</title>
<desc id="desc">左侧是 CPU、主存及多个设备共用地址线数据线控制线；右侧是 PCIe 根端口的独立点对点链路，交换芯片的多个下游设备共用上行链路，CPU 封装内核心、PCIe 根复合体、内存控制器都挂在片内互连上，内存另经内存控制器连接。</desc>
<defs>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2874ac"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#de731b"/></marker>
 <style>
 text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263744;font-size:17px}
 .h{font-size:25px;font-weight:700}.b{font-weight:700}.s{font-size:15px}
 .blue{stroke:#2874ac}.orange{stroke:#de731b}.violet{stroke:#765aa5}
 .wire{fill:none;stroke-width:4;stroke-linejoin:round}.thin{stroke-width:2}
 </style>
</defs>
<rect width="1200" height="760" fill="#f6f1e8"/>
<text x="35" y="42" class="h">同样叫“总线”：连接形状已经变了</text>
<rect x="25" y="67" width="537" height="626" rx="16" fill="#fffdfa" stroke="#afaa9b" stroke-width="2"/>
<rect x="583" y="67" width="592" height="626" rx="16" fill="#fffdfa" stroke="#afaa9b" stroke-width="2"/>
<text x="48" y="107" class="h">经典共享总线</text>
<text x="606" y="107" class="h">PCIe：每段链路点对点</text>

<!-- Classic shared wires. Each participant visibly taps the same three physical groups. -->
<rect x="220" y="135" width="150" height="65" rx="10" fill="#deeffa" stroke="#2874ac" stroke-width="2"/>
<text x="270" y="175" class="b">CPU</text>
<path d="M295 200V282" class="wire blue"/>
<rect x="48" y="282" width="490" height="143" rx="12" fill="#eef5f7" stroke="#6f8a99" stroke-width="2"/>
<text x="67" y="307" class="s b">一组公共物理导线：同一刻只有一个主设备驱动</text>
<path d="M113 330H519" class="wire blue"/>
<path d="M113 366H519" class="wire orange"/>
<path d="M113 402H519" class="wire violet"/>
<text x="65" y="335" class="s b">地址</text><text x="65" y="371" class="s b">数据</text><text x="65" y="407" class="s b">控制</text>
<path d="M112 425V469M225 425V469M339 425V469M460 425V469" class="wire blue"/>
<rect x="54" y="470" width="118" height="65" rx="9" fill="#eaf2f8" stroke="#648ba3" stroke-width="2"/>
<rect x="183" y="470" width="104" height="65" rx="9" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<rect x="299" y="470" width="101" height="65" rx="9" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<rect x="411" y="470" width="105" height="65" rx="9" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<text x="82" y="510" class="b">主存</text><text x="205" y="510" class="b">显卡</text>
<text x="323" y="510" class="b">磁盘</text><text x="437" y="510" class="b">网卡</text>
<circle cx="135" cy="588" r="16" fill="#2874ac"/><circle cx="187" cy="588" r="16" fill="#fff" stroke="#de731b" stroke-width="3"/>
<circle cx="239" cy="588" r="16" fill="#fff" stroke="#de731b" stroke-width="3"/>
<text x="272" y="594" class="s">占用者 1 个；其余请求等待仲裁</text>
<text x="50" y="654" class="s">“地址／数据／控制”各有独立的一组线。</text>

<!-- PCIe CPU package: cores, root complex and memory controller all hang on the on-die interconnect. -->
<rect x="692" y="137" width="367" height="164" rx="13" fill="#e9f2fa" stroke="#668da7" stroke-width="2"/>
<text x="709" y="160" class="b">CPU 封装内</text>
<rect x="708" y="167" width="336" height="20" rx="6" fill="#d3e4f2" stroke="#668da7" stroke-width="1.6"/>
<text x="876" y="182" class="s b" text-anchor="middle">片内互连</text>
<path d="M759 186V214" class="wire blue thin"/><path d="M754 195L759 187L764 195Z M754 205L759 213L764 205Z" fill="#2874ac"/>
<path d="M876 186V214" class="wire blue thin"/><path d="M871 195L876 187L881 195Z M871 205L876 213L881 205Z" fill="#2874ac"/>
<path d="M993 186V214" class="wire blue thin"/><path d="M988 195L993 187L998 195Z M988 205L993 213L998 205Z" fill="#2874ac"/>
<rect x="708" y="215" width="102" height="74" rx="7" fill="#fff" stroke="#6d97b0" stroke-width="2"/>
<rect x="820" y="215" width="112" height="74" rx="7" fill="#fff" stroke="#6d97b0" stroke-width="2"/>
<rect x="942" y="215" width="102" height="74" rx="7" fill="#fff" stroke="#6d97b0" stroke-width="2"/>
<text x="728" y="245" class="s b">CPU 核心</text><text x="726" y="269" class="s">执行指令</text>
<text x="835" y="244" class="s b">PCIe 根</text><text x="838" y="269" class="s">复合体</text>
<text x="949" y="244" class="s b">内存</text><text x="949" y="269" class="s">控制器</text>
<rect x="1102" y="213" width="64" height="80" rx="8" fill="#dfeef5" stroke="#6d97b0" stroke-width="2"/>
<text x="1112" y="259" class="s b">RAM</text>
<path d="M1044 252H1100" class="wire blue"/>
<text x="1064" y="243" class="s">DDR</text>
<!-- Three separate root links, one of which leads to a switch. -->
<path d="M840 290V331H678V376" class="wire blue"/>
<path d="M871 290V376" class="wire blue"/>
<path d="M902 290V331H1022V376" class="wire blue"/>
<text x="680" y="349" class="s b">PCIe ×16</text>
<text x="913" y="323" class="s b">PCIe ×4</text>
<text x="949" y="349" class="s b">上行链路</text>
<rect x="618" y="377" width="120" height="74" rx="9" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<rect x="809" y="377" width="124" height="74" rx="9" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<rect x="955" y="377" width="138" height="74" rx="9" fill="#e7ddf2" stroke="#9375af" stroke-width="2"/>
<text x="659" y="420" class="b">显卡</text><text x="834" y="420" class="b">NVMe SSD</text>
<text x="973" y="410" class="s b">PCIe 交换芯片</text><text x="976" y="435" class="s">按端口转发</text>
<path d="M990 452V520H919V536M1055 452V520H1109V536" class="wire violet"/>
<rect x="866" y="537" width="106" height="63" rx="8" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<rect x="1056" y="537" width="106" height="63" rx="8" fill="#fff0dc" stroke="#c58b4d" stroke-width="2"/>
<text x="897" y="576" class="b">网卡</text><text x="1080" y="576" class="b">其他设备</text>
<rect x="630" y="622" width="519" height="46" rx="9" fill="#fff5e7" stroke="#d3a465"/>
<text x="646" y="641" class="s b">相邻端口之间各有专用链路；交换芯片下的设备</text>
<text x="646" y="661" class="s b">仍会共用上行链路，最终访存也要排队。</text>
<text x="37" y="735" class="s">右图是可能的拓扑示例：设备也可能经芯片组连接；“点对点”只说每一段链路，不表示每个设备都直连 CPU。</text>
</svg>
